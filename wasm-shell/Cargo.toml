[package]
name = "wasm-shell"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
web-sys = { version = "=0.3.72", features = [
  "Window","Document","Element","HtmlElement","HtmlInputElement","HtmlIFrameElement",
  "EventTarget","Event","MouseEvent","KeyboardEvent","InputEvent","DragEvent",
  "MessageEvent","Storage","Location","History","CssStyleDeclaration","DomTokenList",
  
]}
js-sys = "=0.3.72"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
